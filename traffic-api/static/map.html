<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 교통 정보 지도</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .info-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .info-panel h3 {
            margin: 0 0 8px 0;
            font-size: 16px;
        }
        .status-text {
            font-size: 13px;
            color: #555;
        }
    </style>
    <!-- 카카오 지도 API (발급받은 JavaScript 키 필요) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=5a12aa456d25b739c3d7dd555e2f20d0"></script>
</head>
<body>

<div class="info-panel">
    <h3 id="locationTitle">실시간 교통 정보</h3>
    <div id="statusText" class="status-text">데이터를 불러오는 중입니다...</div>
</div>

<div id="map"></div>

<script>
    // ITS 공공데이터 포털 인증키
    const ITS_API_KEY = "35f5f4dfde954c2eb6bcc28f4925d626"; // 실제 키로 교체 필요
    let map = null;

    window.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const minX = urlParams.get("minX");
        const maxX = urlParams.get("maxX");
        const minY = urlParams.get("minY");
        const maxY = urlParams.get("maxY");
        const cx = parseFloat(urlParams.get("cx") || "126.998");
        const cy = parseFloat(urlParams.get("cy") || "37.586");
        const locName = urlParams.get("loc") || "선택 지역";

        document.getElementById("locationTitle").innerText = `${locName} 실시간 교통 정보`;

        // 1. 지도 초기화
        initMap(cx, cy);

        // 2. 파라미터가 유효하면 ITS API를 브라우저에서 직접 호출
        if (minX && maxX && minY && maxY) {
            fetchTrafficDirectly(minX, maxX, minY, maxY);
        } else {
            document.getElementById("statusText").innerText = "좌표 정보가 존재하지 않습니다.";
        }
    });

    // 카카오 지도 생성 함수
    function initMap(cx, cy) {
        const container = document.getElementById('map');
        const options = {
            center: new kakao.maps.LatLng(cy, cx),
            level: 5
        };
        map = new kakao.maps.Map(container, options);
    }

    // 3. 브라우저 단에서 ITS API 직접 호출 (Vercel IP 차단 우회)
    async function fetchTrafficDirectly(minX, maxX, minY, maxY) {
        const url = new URL("https://openapi.its.go.kr/api/NTrafficInfo");
        url.searchParams.append("apiKey", ITS_API_KEY);
        url.searchParams.append("type", "all");
        url.searchParams.append("getType", "json");
        url.searchParams.append("minX", minX);
        url.searchParams.append("maxX", maxX);
        url.searchParams.append("minY", minY);
        url.searchParams.append("maxY", maxY);

        try {
            const response = await fetch(url.toString());
            if (!response.ok) {
                throw new Error(`ITS API HTTP 오류 상태코드: ${response.status}`);
            }

            const trafficData = await response.json();
            const items = trafficData?.body?.items || [];

            console.log(`[ITS API 직접호출 성공] 데이터 개수: ${items.length}개`);
            document.getElementById("statusText").innerText = `조회 완료 (도로 구간: ${items.length}개)`;

            if (items.length === 0) {
                alert("해당 범위 내에 조회된 실시간 교통정보가 없습니다.");
                return;
            }

            // 4. 지도에 수집한 교통정보 그리기
            renderTrafficOnMap(items);

        } catch (error) {
            console.error("ITS API 직접 호출 실패:", error);
            document.getElementById("statusText").innerText = "ITS API 연결 실패";
            alert("교통정보를 불러오는 데 실패했습니다. (ITS API Key 및 네트워크 상태를 확인하세요)");
        }
    }

    // 지도 데이터 렌더링 함수
    function renderTrafficOnMap(items) {
        items.forEach(item => {
            const roadName = item.roadName;
            const speed = parseFloat(item.speed || 0);

            // 속도별 구간 상태 파악
            let status = "정체";
            if (speed >= 60) status = "원활";
            else if (speed >= 30) status = "서행";

            console.log(`[도로명]: ${roadName} | [속도]: ${speed}km/h | [상태]: ${status}`);
            
            // 기존 구현해 두신 Polyline 선 그리기 로직이 있다면 이 위치에 결합하시면 됩니다.
        });
    }
</script>

</body>
</html>
